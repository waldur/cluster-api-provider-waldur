workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - lint
  - test
  - release

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"

.go_cache:
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod
      - bin

.go_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: lint
  image: golang:1.26
  extends:
    - .go_cache
    - .go_rules
  script:
    - make lint-config
    - make lint

test:
  stage: test
  image: golang:1.26
  extends:
    - .go_cache
    - .go_rules
  when: manual
  allow_failure: true
  script:
    - go mod tidy
    - make test

test-e2e:
  stage: test
  image: golang:1.26
  extends:
    - .go_cache
    - .go_rules
  when: manual
  allow_failure: true
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
    - chmod +x ./kind
    - mv ./kind /usr/local/bin/kind
    - kind version
  script:
    - go mod tidy
    - make test-e2e

build-and-push:
  stage: release
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    REGISTRY: ghcr.io
    IMAGE_NAME: waldur/cluster-api-provider-waldur
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache make
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMG="$REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG"
      else
        IMG="$REGISTRY/$IMAGE_NAME:latest"
      fi
    - echo "IMG=$IMG" >> build.env
    - echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin
    - make docker-build docker-push IMG=$IMG
  artifacts:
    reports:
      dotenv: build.env

github-release:
  stage: release
  image: golang:1.26
  needs:
    - build-and-push
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  before_script:
    - curl -fsSL https://github.com/cli/cli/releases/latest/download/gh_2.63.0_linux_amd64.tar.gz -o /tmp/gh.tar.gz
    - tar -xzf /tmp/gh.tar.gz -C /tmp
    - mv /tmp/gh_*_linux_amd64/bin/gh /usr/local/bin/gh
  script:
    - make build-installer IMG=$IMG
    - export GH_TOKEN="$GITHUB_TOKEN"
    - gh release create "$CI_COMMIT_TAG" dist/install.yaml metadata.yaml --generate-notes --repo waldur/cluster-api-provider-waldur
